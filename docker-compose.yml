services:
  recommender-api:
    image: ecommerce-recommender:latest
    build: .
    container_name: recommender_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts:ro
    environment:
      - PYTHONPATH=/app
      - RECSYS_PROJECT_ROOT=/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    restart: unless-stopped

  recommender-dashboard:
    image: ecommerce-recommender:latest
    build: .
    container_name: recommender_dashboard
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts:ro
    environment:
      - PYTHONPATH=/app
      - RECSYS_PROJECT_ROOT=/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    depends_on:
      recommender-api:
        condition: service_healthy
    restart: unless-stopped

  mlflow-ui:
    image: ecommerce-recommender:latest
    build: .
    container_name: recommender_mlflow_ui
    command: >
      sh -c "mkdir -p /app/mlflow_store/mlartifacts &&
      mlflow server
      --backend-store-uri sqlite:////app/mlflow_store/mlflow.db
      --default-artifact-root /app/mlflow_store/mlartifacts
      --host 0.0.0.0
      --port 5000"
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow_store:/app/mlflow_store
    environment:
      - PYTHONPATH=/app
      - RECSYS_PROJECT_ROOT=/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
